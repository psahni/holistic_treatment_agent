  </defs>
  <rect width="320" height="180" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Steam Curves -->
  <path d="M145 65C140 55 150 45 145 35" stroke="#D4A373" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
