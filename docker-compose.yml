version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: holistic-postgres
    environment:
      POSTGRES_DB: holistic_health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d holistic_health"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: holistic-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
